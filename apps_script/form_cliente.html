<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; font-size: 14px; }
    .row { margin-bottom: 10px; }
    label { display: block; font-weight: bold; margin-bottom: 3px; }
    input, select { width: 100%; padding: 6px; box-sizing: border-box; font-size: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 8px 14px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #4285f4; color: white; }
    .btn-secondary { background: #fff; color: #333; }
    .msg { padding: 8px; border-radius: 4px; margin-top: 10px; font-size: 13px; }
    .ok { background: #e6f4ea; color: #1e8e3e; }
    .err { background: #fce8e6; color: #c5221f; }
    .counter { color: #666; font-size: 12px; margin-top: 8px; }
    .credito-only { background: #fef7e0; padding: 10px; border-radius: 4px; margin-top: 4px; }
    .credito-only.disabled { opacity: 0.5; pointer-events: none; }
    .hint { color: #666; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <form id="form">
    <div class="row">
      <label>ID cliente *</label>
      <input type="text" id="id_cliente" required autocomplete="off" autofocus placeholder="ej. C001 o JUAN-PEREZ" />
    </div>
    <div class="row">
      <label>Nombre *</label>
      <input type="text" id="nombre" required autocomplete="off" />
    </div>
    <div class="row">
      <label>Contacto</label>
      <input type="text" id="contacto" autocomplete="off" placeholder="telefono / whatsapp" />
    </div>
    <div class="grid2">
      <div class="row">
        <label>Tipo</label>
        <select id="tipo" onchange="toggleCredito()">
          <option value="contado">contado</option>
          <option value="credito">credito</option>
        </select>
      </div>
      <div class="row">
        <label>Activo</label>
        <select id="activo">
          <option value="SI">SI</option>
          <option value="NO">NO</option>
        </select>
      </div>
    </div>

    <div id="credito_box" class="credito-only disabled">
      <div class="grid2">
        <div class="row">
          <label>Limite credito</label>
          <input type="number" id="limite_credito" step="0.01" min="0" value="0" />
        </div>
        <div class="row">
          <label>Saldo pendiente</label>
          <input type="number" id="saldo_pendiente" step="0.01" min="0" value="0" />
        </div>
      </div>
      <div class="hint">Si te debe del periodo anterior, captura cuanto te debe HOY. Se registra automaticamente como cargo "saldo inicial" en ledger_credito.</div>
    </div>

    <div class="row" style="text-align: right; margin-top: 12px;">
      <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Cerrar</button>
      <button type="submit" class="btn">Guardar y siguiente</button>
    </div>
    <div id="msg"></div>
    <div class="counter" id="counter"></div>
  </form>

  <script>
    function toggleCredito() {
      const box = document.getElementById('credito_box');
      if (document.getElementById('tipo').value === 'credito') {
        box.classList.remove('disabled');
      } else {
        box.classList.add('disabled');
        document.getElementById('limite_credito').value = 0;
        document.getElementById('saldo_pendiente').value = 0;
      }
    }

    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {
        id_cliente: document.getElementById('id_cliente').value,
        nombre: document.getElementById('nombre').value,
        contacto: document.getElementById('contacto').value,
        tipo: document.getElementById('tipo').value,
        limite_credito: document.getElementById('limite_credito').value,
        saldo_pendiente: document.getElementById('saldo_pendiente').value,
        activo: document.getElementById('activo').value
      };
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      google.script.run
        .withSuccessHandler(onSaved)
        .withFailureHandler(onError)
        .guardarClienteDesdeFormulario(data);
    });

    function onSaved(result) {
      const msg = document.getElementById('msg');
      const btn = document.querySelector('button[type=submit]');
      btn.disabled = false;
      btn.textContent = 'Guardar y siguiente';
      if (result.ok) {
        let texto = '&#x2713; Guardado: ' + escapeHtml(result.id_cliente) + ' — ' + escapeHtml(result.nombre);
        if (result.saldoCreado) {
          texto += ' + cargo ' + escapeHtml(result.saldoCreado.folio) + ' por $' + result.saldoCreado.monto;
        }
        msg.innerHTML = '<div class="msg ok">' + texto + '</div>';
        // Reset form (keep tipo + activo sticky)
        const tipo = document.getElementById('tipo').value;
        const activo = document.getElementById('activo').value;
        document.getElementById('form').reset();
        document.getElementById('tipo').value = tipo;
        document.getElementById('activo').value = activo;
        toggleCredito();
        document.getElementById('id_cliente').focus();
        actualizarContador();
      } else {
        msg.innerHTML = '<div class="msg err">&#x2717; ' + escapeHtml(result.error) + '</div>';
      }
    }

    function onError(err) {
      const btn = document.querySelector('button[type=submit]');
      btn.disabled = false;
      btn.textContent = 'Guardar y siguiente';
      document.getElementById('msg').innerHTML = '<div class="msg err">&#x2717; Error: ' + escapeHtml(err.message || String(err)) + '</div>';
    }

    function actualizarContador() {
      google.script.run
        .withSuccessHandler(function(n) {
          document.getElementById('counter').textContent = n + ' cliente(s) activo(s) en cartera';
        })
        .contarClientesActivos();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    toggleCredito();
    actualizarContador();
  </script>
</body>
</html>
