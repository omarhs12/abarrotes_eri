<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: Arial, sans-serif; padding: 8px; font-size: 14px; margin: 0; }
    .top { position: sticky; top: 0; background: white; padding: 8px 0; border-bottom: 1px solid #eee; z-index: 2; }
    #search { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px 4px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; vertical-align: middle; }
    th { background: #f8f9fa; font-size: 12px; text-transform: uppercase; color: #555; }
    .precio { text-align: right; white-space: nowrap; }
    .qty { width: 64px; text-align: center; padding: 8px 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    .subtotal { text-align: right; white-space: nowrap; color: #1e8e3e; font-weight: bold; }
    .row-empty { color: #999; padding: 20px; text-align: center; }
    .footer { position: sticky; bottom: 0; background: white; padding-top: 10px; border-top: 2px solid #4285f4; margin-top: 10px; z-index: 2; box-shadow: 0 -4px 8px rgba(0,0,0,0.04); }
    .total { font-size: 22px; font-weight: bold; text-align: right; padding: 8px 4px; }
    .btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .btn { padding: 12px 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; flex: 1 1 100px; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box; -webkit-appearance: none; appearance: none; }
    .btn-wa { background: #25D366; color: white; border-color: #25D366; font-weight: bold; }
    .btn-primary { background: #4285f4; color: white; border-color: #4285f4; }
    .btn-secondary { background: #fff; color: #333; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    a.btn:not([href]), a.btn[href=""], a.btn.disabled { pointer-events: none; opacity: 0.4; }
    .status { font-size: 12px; color: #666; padding: 6px 0; min-height: 18px; white-space: pre-wrap; }
    .copied { color: #1e8e3e; font-weight: bold; }
    .err { color: #c5221f; }
    .cat-row td { background: #f1f3f4; font-weight: bold; padding-top: 10px; padding-bottom: 6px; font-size: 12px; text-transform: uppercase; color: #555; }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <div class="top">
    <input id="search" type="text" placeholder="Buscar producto..." autocomplete="off" />
  </div>

  <div id="loading" style="padding: 20px; text-align: center; color: #666;">Cargando catalogo...</div>

  <table id="tbl" style="display: none;">
    <thead>
      <tr><th>Producto</th><th class="precio">P.Unit</th><th>Cant</th><th class="precio">Subtotal</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="footer">
    <div class="total">Total: <span id="total">$0.00</span></div>
    <div class="status" id="status">Captura cantidades; el total se actualiza en vivo.</div>
    <div class="btns">
      <a class="btn btn-wa disabled" id="btnWA" href="#" target="_blank" rel="noopener" onclick="onClickWA(event)">WhatsApp</a>
      <button class="btn btn-secondary" id="btnCopy" onclick="copiarTexto()" disabled>Copiar texto</button>
      <button class="btn btn-primary hide" id="btnPrint" onclick="imprimir()" disabled>Imprimir</button>
      <button class="btn btn-secondary" id="btnClose" onclick="onClose()">Cancelar</button>
    </div>
    <textarea id="clip" style="position: absolute; left: -9999px; top: -9999px;" aria-hidden="true"></textarea>
  </div>

  <script>
    // Detectar contexto: modal de Sheets vs. Web App standalone.
    const isModal = !!(window.google && window.google.script && window.google.script.host && typeof window.google.script.host.close === 'function');
    const isWebApp = !isModal;

    let CATALOGO = []; // [{nombre, categoria, precio, activo}]
    const cantidades = {}; // nombre -> cantidad numerica
    const NOMBRE_NEGOCIO = 'Abarrotes Eri';

    // Ajustar UI segun contexto
    if (isWebApp) {
      document.getElementById('btnClose').textContent = 'Limpiar';
      // btnPrint queda hide (no tiene sentido en mobile)
    } else {
      // Modal: mostrar imprimir
      document.getElementById('btnPrint').classList.remove('hide');
    }

    google.script.run
      .withSuccessHandler(onCatalogo)
      .withFailureHandler(err => {
        document.getElementById('loading').textContent = 'Error cargando catalogo: ' + (err.message || err);
      })
      .cargarCatalogoActivos();

    function onCatalogo(items) {
      CATALOGO = items || [];
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tbl').style.display = '';
      render();
      document.getElementById('search').addEventListener('input', render);
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      const filtrados = CATALOGO.filter(it => !q || it.nombre.toLowerCase().includes(q));
      if (!filtrados.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="row-empty">Sin resultados</td></tr>';
      } else {
        let lastCat = null;
        filtrados.forEach(it => {
          if (it.categoria !== lastCat) {
            const trCat = document.createElement('tr');
            trCat.className = 'cat-row';
            trCat.innerHTML = '<td colspan="4">' + escapeHtml(it.categoria) + '</td>';
            tbody.appendChild(trCat);
            lastCat = it.categoria;
          }
          const tr = document.createElement('tr');
          const cant = cantidades[it.nombre] || '';
          const subtotal = (Number(cantidades[it.nombre]) || 0) * it.precio;
          tr.innerHTML =
            '<td>' + escapeHtml(it.nombre) + '</td>' +
            '<td class="precio">$' + fmt(it.precio) + '</td>' +
            '<td><input type="number" inputmode="numeric" pattern="[0-9]*" class="qty" min="0" step="1" data-nombre="' + escapeAttr(it.nombre) + '" value="' + cant + '" /></td>' +
            '<td class="subtotal">' + (subtotal > 0 ? '$' + fmt(subtotal) : '') + '</td>';
          tbody.appendChild(tr);
        });
      }

      tbody.querySelectorAll('input.qty').forEach(inp => {
        inp.addEventListener('input', onQtyChange);
        inp.addEventListener('focus', e => e.target.select());
      });

      actualizarTotal();
    }

    function onQtyChange(e) {
      const nombre = e.target.dataset.nombre;
      const v = parseInt(e.target.value, 10);
      if (!v || v <= 0) {
        delete cantidades[nombre];
      } else {
        cantidades[nombre] = v;
      }
      const tr = e.target.closest('tr');
      const it = CATALOGO.find(x => x.nombre === nombre);
      const sub = (v || 0) * (it ? it.precio : 0);
      tr.querySelector('.subtotal').textContent = sub > 0 ? '$' + fmt(sub) : '';
      actualizarTotal();
      actualizarBotonWA();
    }

    function actualizarTotal() {
      let total = 0;
      CATALOGO.forEach(it => {
        const c = Number(cantidades[it.nombre]) || 0;
        total += c * it.precio;
      });
      document.getElementById('total').textContent = '$' + fmt(total);
      const tieneLineas = Object.keys(cantidades).length > 0;
      document.getElementById('btnCopy').disabled = !tieneLineas;
      document.getElementById('btnPrint').disabled = !tieneLineas;
    }

    // Actualiza el href del boton WhatsApp en tiempo real (sync click → abre app).
    function actualizarBotonWA() {
      const btnWA = document.getElementById('btnWA');
      const tieneLineas = Object.keys(cantidades).length > 0;
      if (!tieneLineas) {
        btnWA.classList.add('disabled');
        btnWA.removeAttribute('href');
        return;
      }
      const texto = generarTicketTextoCliente();
      btnWA.href = 'https://wa.me/?text=' + encodeURIComponent(texto);
      btnWA.classList.remove('disabled');
    }

    function onClickWA(e) {
      if (!Object.keys(cantidades).length) {
        e.preventDefault();
        return;
      }
      setStatus('Abriendo WhatsApp...', 'copied');
    }

    function onClose() {
      if (isWebApp) {
        // Limpiar y empezar de nuevo
        for (const k in cantidades) delete cantidades[k];
        document.getElementById('search').value = '';
        render();
        actualizarBotonWA();
        setStatus('Pedido limpiado.', '');
        window.scrollTo(0, 0);
      } else {
        google.script.host.close();
      }
    }

    function copiarTexto() {
      const texto = generarTicketTextoCliente();
      const ta = document.getElementById('clip');
      ta.value = texto;
      ta.select();
      ta.setSelectionRange(0, 99999);
      const fallback = () => {
        try {
          document.execCommand('copy');
          setStatus('Copiado. Pegalo en WhatsApp.', 'copied');
        } catch (e) {
          setStatus('No se pudo copiar. Selecciona el texto manualmente.', 'err');
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto)
          .then(() => setStatus('Copiado. Pegalo en WhatsApp.', 'copied'))
          .catch(fallback);
      } else {
        fallback();
      }
    }

    function imprimir() {
      if (!isModal) return; // safety
      setStatus('Preparando hoja...', '');
      const btn = document.getElementById('btnPrint');
      btn.disabled = true;
      const lineas = Object.keys(cantidades).map(nombre => {
        const it = CATALOGO.find(x => x.nombre === nombre);
        return { nombre: nombre, precio: it ? it.precio : 0, cantidad: cantidades[nombre] };
      });
      google.script.run
        .withSuccessHandler(res => {
          setStatus('Hoja "' + res.sheetName + '" lista. Cierro y haz Ctrl+P.', 'copied');
          setTimeout(() => google.script.host.close(), 1200);
        })
        .withFailureHandler(err => {
          setStatus('Error: ' + (err.message || err), 'err');
          btn.disabled = false;
        })
        .imprimirPedido(lineas);
    }

    // Genera el texto del ticket en cliente (mismo formato que el backend).
    // Se hace en cliente para que el boton WhatsApp pueda abrir wa.me sync (no bloqueado por mobile).
    function generarTicketTextoCliente() {
      const today = new Date();
      const fecha = pad2(today.getDate()) + '/' + pad2(today.getMonth() + 1) + '/' + today.getFullYear();
      const nombres = Object.keys(cantidades);
      if (!nombres.length) {
        return '*' + NOMBRE_NEGOCIO + '*\nPedido ' + fecha + '\n\n_Sin productos._';
      }

      const MAX_NAME = 30;
      const items = nombres.map(nombre => {
        const it = CATALOGO.find(x => x.nombre === nombre);
        const precio = it ? it.precio : 0;
        const cantidad = cantidades[nombre];
        const display = nombre.length > MAX_NAME ? nombre.slice(0, MAX_NAME - 1) + '…' : nombre;
        return { display, cantidad, subtotal: cantidad * precio };
      });

      const prefixes = items.map(it => '• ' + it.cantidad + ' x ' + it.display);
      const maxPrefixLen = prefixes.reduce((m, p) => Math.max(m, p.length), 0);

      const lineasTxt = items.map((it, i) => {
        const prefix = prefixes[i];
        const dots = '.'.repeat(Math.max(3, maxPrefixLen + 2 - prefix.length));
        return prefix + ' ' + dots + ' $' + fmt(it.subtotal);
      });

      const total = items.reduce((s, it) => s + it.subtotal, 0);

      return [
        '*' + NOMBRE_NEGOCIO + '*',
        'Pedido ' + fecha,
        '',
        ...lineasTxt,
        '',
        '*Total: $' + fmt(total) + '*'
      ].join('\n');
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (cls || '');
    }

    function fmt(n) {
      return Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function escapeAttr(s) {
      return escapeHtml(s);
    }
  </script>
</body>
</html>
