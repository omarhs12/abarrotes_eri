<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; font-size: 14px; }
    .row { margin-bottom: 10px; }
    label { display: block; font-weight: bold; margin-bottom: 3px; }
    input, select { width: 100%; padding: 6px; box-sizing: border-box; font-size: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 8px 14px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #4285f4; color: white; }
    .btn-secondary { background: #fff; color: #333; }
    .msg { padding: 8px; border-radius: 4px; margin-top: 10px; font-size: 13px; }
    .ok { background: #e6f4ea; color: #1e8e3e; }
    .err { background: #fce8e6; color: #c5221f; }
    .counter { color: #666; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <form id="form">
    <div class="row">
      <label>SKU *</label>
      <input type="text" id="sku" required autocomplete="off" autofocus />
    </div>
    <div class="row">
      <label>Nombre *</label>
      <input type="text" id="nombre" required autocomplete="off" />
    </div>
    <div class="grid2">
      <div class="row">
        <label>Categoría</label>
        <select id="categoria">
          <option value="abarrotes">abarrotes</option>
          <option value="bebidas">bebidas</option>
          <option value="limpieza">limpieza</option>
          <option value="papel">papel</option>
          <option value="otros">otros</option>
        </select>
      </div>
      <div class="row">
        <label>Unidad</label>
        <select id="unidad_venta">
          <option value="pza">pza</option>
          <option value="kg">kg</option>
          <option value="lt">lt</option>
          <option value="caja">caja</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="row">
        <label>Peso (kg / unidad)</label>
        <input type="number" id="peso_kg_unidad" step="0.001" min="0" value="0" />
      </div>
      <div class="row">
        <label>Precio venta</label>
        <input type="number" id="precio_venta" step="0.01" min="0" value="0" />
      </div>
    </div>
    <div class="grid2">
      <div class="row">
        <label>Stock mínimo</label>
        <input type="number" id="stock_minimo" step="1" min="0" value="0" />
      </div>
      <div class="row">
        <label>Activo</label>
        <select id="activo">
          <option value="SI">SI</option>
          <option value="NO">NO</option>
        </select>
      </div>
    </div>
    <div class="row" style="text-align: right;">
      <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Cerrar</button>
      <button type="submit" class="btn">Guardar y siguiente</button>
    </div>
    <div id="msg"></div>
    <div class="counter" id="counter"></div>
  </form>

  <script>
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {
        sku: document.getElementById('sku').value,
        nombre: document.getElementById('nombre').value,
        categoria: document.getElementById('categoria').value,
        unidad_venta: document.getElementById('unidad_venta').value,
        peso_kg_unidad: document.getElementById('peso_kg_unidad').value,
        precio_venta: document.getElementById('precio_venta').value,
        stock_minimo: document.getElementById('stock_minimo').value,
        activo: document.getElementById('activo').value
      };
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      google.script.run
        .withSuccessHandler(onSaved)
        .withFailureHandler(onError)
        .guardarProductoDesdeFormulario(data);
    });

    function onSaved(result) {
      const msg = document.getElementById('msg');
      const btn = document.querySelector('button[type=submit]');
      btn.disabled = false;
      btn.textContent = 'Guardar y siguiente';
      if (result.ok) {
        msg.innerHTML = '<div class="msg ok">&#x2713; Guardado: ' + escapeHtml(result.sku) + ' &mdash; ' + escapeHtml(result.nombre) + '</div>';
        // Reset form for next entry (keep categoria + unidad sticky)
        const cat = document.getElementById('categoria').value;
        const unidad = document.getElementById('unidad_venta').value;
        document.getElementById('form').reset();
        document.getElementById('categoria').value = cat;
        document.getElementById('unidad_venta').value = unidad;
        document.getElementById('sku').focus();
        actualizarContador();
      } else {
        msg.innerHTML = '<div class="msg err">&#x2717; ' + escapeHtml(result.error) + '</div>';
      }
    }

    function onError(err) {
      const btn = document.querySelector('button[type=submit]');
      btn.disabled = false;
      btn.textContent = 'Guardar y siguiente';
      document.getElementById('msg').innerHTML = '<div class="msg err">&#x2717; Error: ' + escapeHtml(err.message || String(err)) + '</div>';
    }

    function actualizarContador() {
      google.script.run
        .withSuccessHandler(function(n) {
          document.getElementById('counter').textContent = n + ' producto(s) activo(s) en catálogo';
        })
        .contarProductosActivos();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    actualizarContador();
  </script>
</body>
</html>
